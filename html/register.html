<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Aventra</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header>
<nav class="navbar">
    <a href="index.html" class="logo"><h2>Aventra</h2></a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="product.html">Products</a></li>
        <li><a href="login.html">Login</a></li>
    </ul>
</nav>
</header>

<section class="auth-section">
    <div class="auth-card">

        <!-- STEP 1: Details fill karo + OTP bhejo -->
        <div id="step-details">
            <h1>Create Account</h1>
            <p class="auth-subtext">Sign up to start ordering fresh groceries in minutes.</p>

            <form id="register-form">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Re-enter password" minlength="6" required>
                </div>

                <button type="submit" class="auth-btn" id="send-otp-btn">Send OTP</button>

            </form>
        </div>

        <!-- STEP 2: OTP verify karo (hidden by default) -->
        <div id="step-otp" style="display:none;">
            <h1>Verify Email</h1>
            <p class="auth-subtext">
                OTP Sent Succesfully On <strong id="otp-email-display"></strong>
            </p>

            <form id="otp-form">
                <div class="form-group">
                    <label for="otp">Enter OTP</label>
                    <input type="text" id="otp" placeholder="6-digit OTP" maxlength="6" required>
                </div>

                <button type="submit" class="auth-btn" id="verify-otp-btn">Verify & Create Account</button>
            </form>

            <span class="auth-switch" id="back-to-details" style="display:block;cursor:pointer;">&larr;  Edit Details  </span>
        </div>

        <p class="auth-switch">
            Already have an account? <a href="login.html">Login</a>
        </p>

    </div>
</section>

<footer>
    <p style="text-align:center;">© 2026 Aventra. All Rights Reserved.</p>
</footer>

<script src="js/app.js"></script>
<script src="js/login.js"></script>

</body>
</html>
