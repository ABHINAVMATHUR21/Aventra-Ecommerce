<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Aventra</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header>
<nav class="navbar">
    <a href="index.html" class="logo"><h2>Aventra</h2></a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="product.html">Products</a></li>
        <li><a href="orders.html">Orders</a></li>
    </ul>
    <div class="nav-icons">
        <a href="profile.html" id="user-icon-link"><i class="fa-regular fa-user"></i></a>
        <a href="cart.html">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count">0</span>
        </a>
    </div>
</nav>
</header>

<div class="page-wrap">
    <h1>My Orders</h1>
    <div id="orders-container">
        <p>Loading orders...</p>
    </div>
</div>

<footer>
    <p style="text-align:center;">© 2026 Aventra. All Rights Reserved.</p>
</footer>

<script src="js/app.js"></script>
<script>
// ===============================
// orders.html inline script
// ===============================
// NOTE: Ye assume karta hai GET /api/orders endpoint jo
// current logged-in user ke saare orders return karta hai.

if (!requireLogin()) {
    // requireLogin redirect kar dega
}

const ordersContainer = document.getElementById("orders-container");

async function loadOrders() {
    try {
        const orders = await apiFetch("/orders/my-orders");

        if (!orders.length) {
            ordersContainer.innerHTML = `
                <div class="empty-cart">
                    <p>Aapne abhi tak koi order nahi kiya hai.</p>
                    <a href="product.html">Shop Now &rarr;</a>
                </div>
            `;
            return;
        }

        ordersContainer.innerHTML = orders.map((order) => `
            <div class="order-card" data-order-id="${order.id}" style="cursor:pointer;">
                <div class="order-card-top">
                    <div>
                        <strong>Order #${order.id}</strong>
                        <p style="color:#777;font-size:.85rem;">${order.createdAt || ""}</p>
                    </div>
                    <span class="order-status">${order.status || "PLACED"}</span>
                </div>
                <p style="color:#777;font-size:.85rem;">Click to view full details &rarr;</p>
                <p style="margin-top:10px;font-weight:600;">Total: ₹${order.totalAmount}</p>
            </div>
        `).join("");

    } catch (error) {
        ordersContainer.innerHTML = "<p>Orders load nahi ho paaye. Backend check karein.</p>";
        console.error(error);
    }
}

loadOrders();

// ---------- Click an order to open its details in a new tab ----------

ordersContainer.addEventListener("click", (e) => {
    const card = e.target.closest(".order-card");
    if (!card) return;

    const orderId = card.dataset.orderId;
    window.open(`order-details.html?id=${orderId}`, "_blank");
});
</script>

</body>
</html>
