<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Aventra</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header>
<nav class="navbar">
    <a href="index.html" class="logo"><h2>Aventra</h2></a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="product.html">Products</a></li>
        <li><a href="register.html">Register</a></li>
    </ul>
</nav>
</header>

<section class="auth-section">
    <div class="auth-card">

        <h1>Welcome Back</h1>
        <p class="auth-subtext">Login to continue shopping fresh groceries.</p>

        <form id="login-form">

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="auth-btn" id="login-btn">Login</button>

        </form>

        <p class="auth-switch">
            New to Aventra? <a href="register.html">Create an account</a>
        </p>

    </div>
</section>

<footer>
    <p style="text-align:center;">© 2026 Aventra. All Rights Reserved.</p>
</footer>

<script src="js/app.js"></script>
<script src="js/login.js"></script>

</body>
</html>
