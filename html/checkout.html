<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Aventra</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        .address-option{
            border:2px solid #ddd;
            border-radius:10px;
            padding:14px 16px;
            margin-bottom:12px;
            cursor:pointer;
            transition:.2s;
        }
        .address-option.selected{
            border-color:var(--primary);
            background:#f0fbf3;
        }
        .address-option strong{
            display:block;
            margin-bottom:4px;
        }
        .add-address-toggle{
            color:var(--primary);
            font-weight:600;
            cursor:pointer;
            display:inline-block;
            margin-top:6px;
        }
    </style>
</head>

<body>

<header>
<nav class="navbar">
    <a href="index.html" class="logo"><h2>Aventra</h2></a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="cart.html">Cart</a></li>
    </ul>
    <div class="nav-icons">
        <a href="profile.html" id="user-icon-link"><i class="fa-regular fa-user"></i></a>
        <a href="cart.html">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count">0</span>
        </a>
    </div>
</nav>
</header>

<div class="page-wrap">
    <h1>Checkout</h1>

    <!--
        NOTE: Address yahan save/select hoti hai (AddressController se),
        lekin OrderService.placeOrder() abhi address ko order se link
        nahi karta — ye sirf aapke address book me save rehti hai.
        Agar order ke saath delivery address bhi chahiye, OrderService
        me addressId accept karna padega.
    -->

    <div class="checkout-grid">

        <div class="address-card">
            <h3 style="margin-bottom:20px;">Delivery Address</h3>
            <div id="address-list">Loading addresses...</div>

            <span class="add-address-toggle" id="add-address-toggle">+ Add new address</span>

            <h3 style="margin:24px 0 12px;">Payment Method</h3>
            <div id="payment-method-list">
                <label class="address-option selected" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                    <input type="radio" name="paymentMethod" value="COD" checked>
                    <span><strong>Cash on Delivery</strong><br><span style="color:#777;font-size:.85rem;">Pay when your order arrives</span></span>
                </label>
                <label class="address-option" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                    <input type="radio" name="paymentMethod" value="UPI">
                    <span><strong>UPI</strong><br><span style="color:#777;font-size:.85rem;">Google Pay, PhonePe, Paytm, etc.</span></span>
                </label>
                <label class="address-option" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                    <input type="radio" name="paymentMethod" value="CARD">
                    <span><strong>Credit / Debit Card</strong><br><span style="color:#777;font-size:.85rem;">Visa, Mastercard, RuPay</span></span>
                </label>
            </div>

            <form id="address-form" style="display:none;margin-top:16px;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="phone" pattern="[0-9]{10}" required>
                </div>
                <div class="form-group">
                    <label>Address Line 1</label>
                    <input type="text" id="line1" required>
                </div>
                <div class="form-group">
                    <label>Address Line 2 (optional)</label>
                    <input type="text" id="line2">
                </div>
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="city" required>
                </div>
                <div class="form-group">
                    <label>State</label>
                    <input type="text" id="state" required>
                </div>
                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" id="pincode" pattern="[0-9]{6}" required>
                </div>
                <button type="submit" class="auth-btn" id="save-address-btn">Save Address</button>
            </form>
        </div>

        <div class="cart-summary" style="margin:0;" id="order-summary">
            <!-- JS se fill hoga -->
        </div>

    </div>
</div>

<footer>
    <p style="text-align:center;">© 2026 Aventra. All Rights Reserved.</p>
</footer>

<script src="js/app.js"></script>
<script>
if (!requireLogin()) {
    // requireLogin already redirect kar dega
}

const addressList = document.getElementById("address-list");
const addressForm = document.getElementById("address-form");
const addAddressToggle = document.getElementById("add-address-toggle");
const summaryBox = document.getElementById("order-summary");

let cartTotal = 0;
let selectedAddressId = null;

// ---------- Payment method selection ----------

let selectedPaymentMethod = "COD";

document.querySelectorAll('input[name="paymentMethod"]').forEach((radio) => {
    radio.addEventListener("change", () => {
        document.querySelectorAll("#payment-method-list .address-option").forEach((el) => {
            el.classList.remove("selected");
        });
        radio.closest(".address-option").classList.add("selected");
        selectedPaymentMethod = radio.value;

        const payBtnEl = document.getElementById("pay-btn");
        if (payBtnEl) {
            payBtnEl.innerText = selectedPaymentMethod === "COD" ? "Place Order (COD)" : "Pay & Place Order";
        }
    });
});

addAddressToggle.addEventListener("click", () => {
    addressForm.style.display = addressForm.style.display === "none" ? "block" : "none";
});

// ---------- Addresses ----------

async function loadAddresses() {
    try {
        const addresses = await apiFetch("/addresses");

        if (!addresses.length) {
            addressList.innerHTML = "<p style='color:#777;'>Koi address save nahi hai.</p>";
            addressForm.style.display = "block";
            return;
        }

        addressList.innerHTML = addresses.map((a) => `
            <div class="address-option ${a.defaultAddress ? "selected" : ""}" data-id="${a.id}">
                <strong>${a.fullName} — ${a.phone}</strong>
                <span>${a.line1}${a.line2 ? ", " + a.line2 : ""}, ${a.city}, ${a.state} - ${a.pincode}</span>
            </div>
        `).join("");

        const defaultAddr = addresses.find((a) => a.defaultAddress) || addresses[0];
        selectedAddressId = defaultAddr.id;

        addressList.querySelectorAll(".address-option").forEach((el) => {
            el.addEventListener("click", () => {
                addressList.querySelectorAll(".address-option").forEach((x) => x.classList.remove("selected"));
                el.classList.add("selected");
                selectedAddressId = el.dataset.id;
            });
        });

    } catch (error) {
        addressList.innerHTML = "<p>Address load nahi ho paayi.</p>";
        console.error(error);
    }
}

addressForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const btn = document.getElementById("save-address-btn");
    btn.disabled = true;
    btn.innerText = "Saving...";

    try {
        await apiFetch("/addresses", {
            method: "POST",
            body: JSON.stringify({
                fullName: document.getElementById("fullName").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                line1: document.getElementById("line1").value.trim(),
                line2: document.getElementById("line2").value.trim(),
                city: document.getElementById("city").value.trim(),
                state: document.getElementById("state").value.trim(),
                pincode: document.getElementById("pincode").value.trim(),
                defaultAddress: true
            })
        });

        showToast("Address saved!");
        addressForm.reset();
        addressForm.style.display = "none";
        await loadAddresses();

    } catch (error) {
        showToast(error.message || "Address save nahi ho payi");
    } finally {
        btn.disabled = false;
        btn.innerText = "Save Address";
    }
});

loadAddresses();

// ---------- Order Summary ----------

async function loadSummary() {
    try {
        const cart = await apiFetch("/cart");

        if (!cart.length) {
            summaryBox.innerHTML = `
                <div class="empty-cart">
                    <p>Aapka cart khaali hai.</p>
                    <a href="product.html">Shop Now &rarr;</a>
                </div>
            `;
            return;
        }

        cartTotal = cart.reduce((sum, item) => sum + (item.product?.price || 0) * item.quantity, 0);

        summaryBox.innerHTML = `
            <h3 style="margin-bottom:15px;">Order Summary</h3>
            ${cart.map(item => `
                <div class="summary-row">
                    <span>${item.product?.name} x${item.quantity}</span>
                    <span>₹${(item.product?.price || 0) * item.quantity}</span>
                </div>
            `).join("")}
            <div class="summary-row total"><span>Total</span><span>₹${cartTotal}</span></div>
            <button class="checkout-btn" id="pay-btn">Pay & Place Order</button>
        `;

        document.getElementById("pay-btn").addEventListener("click", startPayment);

    } catch (error) {
        summaryBox.innerHTML = "<p>Cart load nahi ho paaya.</p>";
        console.error(error);
    }
}

loadSummary();

// ---------- Payment + Order ----------

function resetPayButton() {
    const payBtn = document.getElementById("pay-btn");
    if (!payBtn) return;
    payBtn.disabled = false;
    payBtn.innerText = selectedPaymentMethod === "COD" ? "Place Order (COD)" : "Pay & Place Order";
}

async function cancelPendingPayment(orderId) {
    try {
        await apiFetch(`/orders/${orderId}/cancel-payment`, { method: "POST" });
    } catch (error) {
        console.error("Pending payment cancel nahi ho paaya", error);
    }
}

async function startPayment() {
    if (!selectedAddressId) {
        showToast("Pehle ek address save/select karein");
        return;
    }

    const payBtn = document.getElementById("pay-btn");
    payBtn.disabled = true;
    payBtn.innerText = "Processing...";

    let internalOrderId = null;
    let paymentCompleted = false;

    try {
        // Cart, address and total are validated on the backend before checkout opens.
        const placedOrder = await apiFetch("/orders/place", {
            method: "POST",
            body: JSON.stringify({
                addressId: Number(selectedAddressId),
                paymentMethod: selectedPaymentMethod
            })
        });

        internalOrderId = placedOrder.order.id;

        if (selectedPaymentMethod === "COD") {
            showToast("Order placed successfully!");
            setTimeout(() => (window.location.href = "orders.html"), 900);
            return;
        }

        const options = {
            key: placedOrder.razorpayKeyId,
            amount: placedOrder.amountInPaise,
            currency: placedOrder.currency,
            name: "Aventra",
            description: `Order #${internalOrderId}`,
            order_id: placedOrder.razorpayOrderId,
            handler: async function (response) {
                // Do not release stock after a successful payment response.
                paymentCompleted = true;
                try {
                    await apiFetch("/payments/verify", {
                        method: "POST",
                        body: JSON.stringify({
                            orderId: internalOrderId,
                            razorpayOrderId: response.razorpay_order_id,
                            razorpayPaymentId: response.razorpay_payment_id,
                            razorpaySignature: response.razorpay_signature
                        })
                    });
                    showToast("Payment successful. Order confirmed!");
                    setTimeout(() => (window.location.href = "orders.html"), 900);
                } catch (error) {
                    showToast(error.message || "Payment received but verification is pending. Please contact support.");
                    resetPayButton();
                }
            },
            modal: {
                ondismiss: async function () {
                    if (!paymentCompleted && internalOrderId) {
                        await cancelPendingPayment(internalOrderId);
                        showToast("Payment cancelled. Reserved stock has been released.");
                    }
                    resetPayButton();
                }
            },
            theme: { color: "#16a34a" }
        };

        const rzp = new Razorpay(options);
        rzp.on("payment.failed", async function () {
            const shouldReleaseStock = !paymentCompleted && internalOrderId;
            paymentCompleted = true;
            if (shouldReleaseStock) {
                await cancelPendingPayment(internalOrderId);
                showToast("Payment failed. Please try again.");
            }
            resetPayButton();
        });
        payBtn.innerText = "Complete payment…";
        rzp.open();

    } catch (error) {
        if (internalOrderId && !paymentCompleted) {
            await cancelPendingPayment(internalOrderId);
        }
        showToast(error.message || "Payment start nahi ho paaya");
        resetPayButton();
    }
}
</script>

</body>
</html>
