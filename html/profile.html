<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Aventra</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header>
<nav class="navbar">
    <a href="index.html" class="logo"><h2>Aventra</h2></a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="product.html">Products</a></li>
        <li><a href="orders.html">Orders</a></li>
    </ul>
    <div class="nav-icons">
        <a href="profile.html" id="user-icon-link"><i class="fa-regular fa-user"></i></a>
        <a href="cart.html">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count">0</span>
        </a>
    </div>
</nav>
</header>

<div class="page-wrap">
    <h1>My Profile</h1>

    <div class="profile-card">

        <div class="profile-header">
            <div class="profile-avatar" id="profile-avatar">A</div>
            <div>
                <h2 id="profile-header-name">My Profile</h2>
                <p id="profile-header-email">Manage your account details</p>
            </div>
        </div>

        <div class="profile-body">
            <form id="profile-form">

                <div class="profile-row">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" pattern="[0-9]{10}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" disabled>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="Default address (optional)">
                </div>

                <button type="submit" class="auth-btn" id="save-profile-btn">Save Changes</button>

            </form>

            <span class="logout-link" id="logout-link">Logout</span>
        </div>
    </div>
</div>

<footer>
    <p style="text-align:center;">© 2026 Aventra. All Rights Reserved.</p>
</footer>

<script src="js/app.js"></script>
<script>
// ===============================
// profile.html inline script
// ===============================
// GET  /users/profile  -> User
// PUT  /users/profile  -> ProfileUpdateRequest {name, phone, address} -> User

if (!requireLogin()) {
    // requireLogin already redirect kar dega
}

const profileForm = document.getElementById("profile-form");

async function loadProfile() {
    try {
        const user = await apiFetch("/users/profile");

        document.getElementById("name").value = user.name || "";
        document.getElementById("email").value = user.email || "";
        document.getElementById("phone").value = user.phone || "";
        document.getElementById("address").value = user.address || "";

        document.getElementById("profile-header-name").innerText = user.name || "My Profile";
        document.getElementById("profile-header-email").innerText = user.email || "";
        document.getElementById("profile-avatar").innerText = (user.name || "A").trim().charAt(0).toUpperCase();

    } catch (error) {
        showToast(error.message || "Profile load nahi ho paayi");
    }
}

loadProfile();

profileForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const saveBtn = document.getElementById("save-profile-btn");
    saveBtn.disabled = true;
    saveBtn.innerText = "Saving...";

    try {
        await apiFetch("/users/profile", {
            method: "PUT",
            body: JSON.stringify({
                name: document.getElementById("name").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                address: document.getElementById("address").value.trim()
            })
        });

        showToast("Profile updated successfully!");

        const updatedName = document.getElementById("name").value.trim();
        document.getElementById("profile-header-name").innerText = updatedName || "My Profile";
        document.getElementById("profile-avatar").innerText = (updatedName || "A").trim().charAt(0).toUpperCase();

    } catch (error) {
        showToast(error.message || "Profile update nahi ho payi");
    } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "Save Changes";
    }
});

document.getElementById("logout-link").addEventListener("click", logout);
</script>

</body>
</html>
