<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Aventra</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        .filter-bar{
            max-width:1300px;
            margin:30px auto 0;
            padding:0 40px;
            display:flex;
            flex-wrap:wrap;
            gap:12px;
        }
        .filter-chip{
            padding:8px 20px;
            border-radius:30px;
            border:2px solid #ddd;
            background:#fff;
            cursor:pointer;
            font-size:.9rem;
            transition:.2s;
        }
        .filter-chip.active,
        .filter-chip:hover{
            background:var(--primary);
            border-color:var(--primary);
            color:#fff;
        }
        .products-heading{
            max-width:1300px;
            margin:30px auto 0;
            padding:0 40px;
        }
    </style>
</head>

<body>

<header>
<nav class="navbar">
    <a href="index.html" class="logo"><h2>Aventra</h2></a>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="Search groceries...">
        <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="product.html">Products</a></li>
        <li><a href="orders.html">Orders</a></li>
    </ul>

    <div class="nav-icons">
        <a href="profile.html" id="user-icon-link"><i class="fa-regular fa-user"></i></a>
        <a href="wishlist.html"><i class="fa-regular fa-heart"></i></a>
        <a href="cart.html">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count">0</span>
        </a>
    </div>
</nav>
</header>

<div class="products-heading">
    <h2 style="text-align:left;margin-bottom:0;">All Products</h2>
</div>

<div class="filter-bar" id="filter-bar">
    <div class="filter-chip active" data-category="all">All</div>
    <div class="filter-chip" data-category="fruits">Fruits</div>
    <div class="filter-chip" data-category="vegetables">Vegetables</div>
    <div class="filter-chip" data-category="dairy">Dairy, Bread & Eggs</div>
    <div class="filter-chip" data-category="meat">Meat & Seafood</div>
    <div class="filter-chip" data-category="beverages">Beverages</div>
    <div class="filter-chip" data-category="household">Household</div>
</div>

<section class="products">
    <div class="product-grid" id="product-grid">
        <p>Loading products...</p>
    </div>
</section>

<footer>
    <p style="text-align:center;">© 2026 Aventra. All Rights Reserved.</p>
</footer>

<script src="js/app.js"></script>
<script src="js/products.js"></script>

</body>
</html>
