<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details | Aventra</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        .item-row{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:14px 0;
            border-bottom:1px solid #eee;
        }
        .item-row:last-child{
            border-bottom:none;
        }
        .item-name{
            font-weight:500;
        }
        .item-qty{
            color:#777;
            font-size:.85rem;
        }
    </style>
</head>

<body>

<header>
<nav class="navbar">
    <a href="index.html" class="logo"><h2>Aventra</h2></a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="orders.html">All Orders</a></li>
    </ul>
</nav>
</header>

<div class="page-wrap">
    <a href="orders.html" style="display:inline-flex;align-items:center;gap:8px;color:var(--primary);font-weight:600;margin-bottom:16px;text-decoration:none;">
        <i class="fa-solid fa-arrow-left"></i> Back to My Orders
    </a>
    <h1 id="order-title">Order Details</h1>
    <div id="order-detail-container">
        <p>Loading order...</p>
    </div>
</div>

<footer>
    <p style="text-align:center;">© 2026 Aventra. All Rights Reserved.</p>
</footer>

<script src="js/app.js"></script>
<script>
// ===============================
// order-details.html inline script
// ===============================
// Order id URL query param se aata hai: order-details.html?id=123
// Header info /orders/my-orders se (find by id), items /orders/{id}/items se

if (!requireLogin()) {
    // requireLogin redirect kar dega
}

const params = new URLSearchParams(window.location.search);
const orderId = params.get("id");
const container = document.getElementById("order-detail-container");

if (!orderId) {
    container.innerHTML = "<p>Koi order ID nahi mili.</p>";
} else {
    loadOrderDetails();
}

async function loadOrderDetails() {
    try {
        const [orders, items] = await Promise.all([
            apiFetch("/orders/my-orders"),
            apiFetch(`/orders/${orderId}/items`)
        ]);

        const order = orders.find((o) => String(o.id) === String(orderId));

        if (!order) {
            container.innerHTML = "<p>Ye order nahi mila.</p>";
            return;
        }

        document.getElementById("order-title").innerText = `Order #${order.id}`;

        const itemsHtml = items.length
            ? items.map((item) => `
                <div class="item-row">
                    <div>
                        <div class="item-name">${item.product?.name || "Product"}</div>
                        <div class="item-qty">Qty: ${item.quantity} &times; ₹${item.price}</div>
                    </div>
                    <div>₹${item.subTotal}</div>
                </div>
            `).join("")
            : "<p style='color:#777;'>Is order me koi item nahi mila.</p>";

        container.innerHTML = `
            <div class="order-card">
                <div class="order-card-top">
                    <div>
                        <strong>Placed on:</strong> ${order.createdAt || "—"}
                    </div>
                    <span class="order-status">${order.status || "PLACED"}</span>
                </div>

                ${order.address ? `
                    <div style="margin:14px 0;padding:14px 0;border-top:1px solid #eee;border-bottom:1px solid #eee;">
                        <strong>Delivery Address</strong>
                        <p style="color:#555;margin-top:6px;">
                            ${order.address.fullName || ""}, ${order.address.phone || ""}<br>
                            ${order.address.line1 || ""}${order.address.line2 ? ", " + order.address.line2 : ""}<br>
                            ${order.address.city || ""}, ${order.address.state || ""} - ${order.address.pincode || ""}
                        </p>
                    </div>
                ` : ""}

                <div style="margin:14px 0;">
                    <strong>Payment Method:</strong> ${order.paymentMethod || "—"}
                </div>

                <div>${itemsHtml}</div>

                <div style="margin-top:16px;padding-top:16px;border-top:2px solid #eee;font-weight:700;font-size:1.1rem;display:flex;justify-content:space-between;">
                    <span>Total</span>
                    <span>₹${order.totalAmount}</span>
                </div>
            </div>
        `;

    } catch (error) {
        container.innerHTML = "<p>Order details load nahi ho paayi.</p>";
        console.error(error);
    }
}
</script>

</body>
</html>
